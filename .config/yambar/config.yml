block: &block {stack: [{background: {color: 11111bff}}, {border: {size: 8, color: 11111bff}}]}
bg_default: &bg_default {stack: [{background: {color: cdd6f433}}]}
bar:
  height: 32
  location: top
  background: 11111bff
  font: JetBrainsMono Nerd Font:pixelsize=16
  spacing: 0
  margin: 0

  border:
    width: 0
    margin: 0
    color: 00000000

  left:
    - label:
        content:
          - string:
              text: " 󰲒  "
              on-click: "fuzzel --no-icons"
              foreground: 89b4faff
    
    - river:
        anchors:
          - base: &river_base
              left-margin: 15
              right-margin: 15
              default: {string: {text: }}
              conditions:
                id == 1: {string: {text: 1}}
                id == 2: {string: {text: 2}}
                id == 3: {string: {text: 3}}
                id == 4: {string: {text: 4}}
                id == 5: {string: {text: 5}}
                id == 6: {string: {text: 6}}
                id == 7: {string: {text: 7}}
                id == 8: {string: {text: 8}}
                id == 9: {string: {text: 9}}

        content:
          map:
            on-click:
              left: sh -c "riverctl set-focused-tags $((1 << ({id} - 1)))"
              right: sh -c "riverctl toggle-focused-tags $((1 << ({id} -1)))"
              middle: sh -c "riverctl toggle-view-tags $((1 << ({id} -1)))"
            conditions:
              state == urgent:
                map:
                  <<: *river_base
                  deco: {background: {color: D08770ff}}
              state == focused:
                map:
                  <<: *river_base
                  deco: *bg_default
              state == visible && ~occupied:
                map:
                  <<: *river_base
              state == visible && occupied:
                map:
                  <<: *river_base
                  deco: *bg_default
              state == unfocused:
                map:
                  <<: *river_base
              state == invisible && ~occupied: {empty: {}}
              state == invisible && occupied:
                map:
                  <<: *river_base
                  deco: {underline: {size: 0, color: 1e1e2eff}}
    - label:
        content: {string: {text: " | ", deco: *block, foreground: 787878ff}}
    - foreign-toplevel:
        content:
          map:
            conditions:
              ~activated: {empty: {}}
              activated:
                - string: {text: "{app-id} ", foreground: 89b4faff}
                - string: {text: "•", foreground: 1e1e2eff}
                - string: {text: " {title}"}

  right:

    - network:
        content:
          map:
            default:
              string:
                text: "{ssid}  "
            conditions:
              name == "wlan0" && carrier == true:
                string:
                  text: "{ssid}  "

    - script:
        path: /home/ipoteka/.config/yambar/mpd.sh
        poll-interval: 1000
        content:
          string:
            text: "{mpd_title}"

    - label:
        content: {string: {text: " | ", deco: *block, foreground: 1e1e2eff}}

    - mem:
        poll-interval: 2500
        content: {string: {text: "  RAM {percent_used}%  ", deco: *block}}

    - cpu:
        poll-interval: 2500
        content: {map: {conditions: {id < 0: {string: {text: "  CPU {cpu}%  ", deco: *block}}}}}

    - label:
        content: {string: {text: "|  ", deco: *block, foreground: 1e1e2eff}}

    - clock:
        content: {string: {text: " {date} {time}  ", deco: *block}}
